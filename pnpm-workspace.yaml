# pnpm 配置（pnpm 10+ 设置存放于此）
# 单包项目：workspace 只包含根目录
packages:
  - '.'

# 放行需要运行构建脚本的依赖
# pnpm 11+ 使用 allowBuilds 映射格式（onlyBuiltDependencies 已在 v11 移除）
# pnpm 12 默认 strictDepBuilds=true，未放行的构建脚本会报 ERR_PNPM_IGNORED_BUILDS
allowBuilds:
  esbuild: true
  sharp: true
  msw: true
  unrs-resolver: true

# 兜底：允许所有依赖运行构建脚本（pnpm 10.9+）
# 锁文件已固定依赖树，实际放行的就是上面 4 个包；
# 避免 pnpm 12.0.0 对 allowBuilds 解析异常导致构建反复失败
dangerouslyAllowAllBuilds: true
